name: Update latest repos

on:
  schedule:
    - cron: "0 11 * * *" # every day, 06:00 Colombia time
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/update-latest-repos.mjs, .github/workflows/latest-repos.yml]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/update-latest-repos.mjs "${{ github.repository_owner }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          if git diff --quiet README.md; then
            echo "No changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "docs: update latest repos"
            git push
          fi
